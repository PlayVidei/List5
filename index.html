
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#11111b">
<title>NontonYuk - Galeri Video</title>

<style>
:root{
  --bg:#101018;--panel:#191923;--card:#222230;
  --border:#343443;--accent:#ed3157;
  --text:#fff;--muted:#a6a6b5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:10;background:#171721;border-bottom:1px solid var(--border);padding:14px}
.header-inner{max-width:1150px;margin:auto}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.brand-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;background:linear-gradient(135deg,#ff5475,#b80f3b);box-shadow:0 4px 15px #ed315744}
.brand-name{font-size:25px;font-weight:900;letter-spacing:-1px;color:#fff}
.brand-name span{color:var(--accent)}
.brand-tagline{margin:10px 0 0 2px;font-size:9px;letter-spacing:2px;color:var(--muted);font-weight:bold}
.search-wrap{display:flex;gap:8px}
.search{flex:1;min-width:0;width:100%;height:45px;padding:0 15px;border-radius:10px;border:1px solid var(--border);background:#242431;color:white;font-size:15px;outline:none}
.search:focus{border-color:var(--accent)}
.search-button{height:45px;padding:0 17px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:bold;font-size:14px;cursor:pointer}
.search-button:active{transform:scale(.97)}
main{max-width:1150px;margin:auto;padding:15px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0 15px}
.section-heading h2{margin:0;font-size:18px}
.total{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.video-card{min-width:0;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:11px;cursor:pointer;transition:transform .18s,border-color .18s}
.video-card:active{transform:scale(.98)}
.video-card:hover{border-color:var(--accent)}
.thumb{position:relative;width:100%;aspect-ratio:16/9;background:#11111b;overflow:hidden}
.thumb img{display:block;width:100%;height:100%;object-fit:contain}
.play-icon{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.18));pointer-events:none}
.play-icon span{width:43px;height:43px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(237,49,87,.94);color:white;font-size:18px;padding-left:3px;box-shadow:0 3px 15px #0008}
.video-info{padding:10px}
.video-title{font-size:13px;line-height:1.4;font-weight:700;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video-number{color:var(--muted);font-size:11px;margin-top:7px}
.pagination{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:7px;margin:25px 0}
.pagination button{min-width:36px;height:36px;border:1px solid var(--border);border-radius:8px;background:#242431;color:white;cursor:pointer;font-size:13px}
.pagination button.active{background:var(--accent);border-color:var(--accent)}
.pagination button:disabled{opacity:.35;cursor:not-allowed}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--muted);background:var(--panel);border-radius:10px}
footer{max-width:1150px;margin:auto;padding:25px 15px;text-align:center;font-size:12px;color:var(--muted)}

/* PLAYER */
.player-screen{display:none;position:fixed;inset:0;z-index:100;background:#000;overflow-y:auto}
.player-screen.show{display:block}
.player-header{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;background:#171721;border-bottom:1px solid #292936}
.back-button{border:0;border-radius:8px;background:#30303d;color:white;padding:10px 14px;font-size:13px;font-weight:bold;cursor:pointer}
.player-label{font-size:12px;color:var(--muted)}
.player-area{position:relative;width:100%;height:calc(100dvh - 55px);min-height:300px;background:#000;display:flex;justify-content:center;align-items:center}
.player-area iframe{display:block;width:100%;height:100%;border:0;background:#000}
.player-loading{position:absolute;z-index:1;color:#ddd;font-size:14px;pointer-events:none}
.player-caption{padding:14px;background:#171721}
.player-caption h2{margin:0;font-size:16px}
.player-caption p{margin:7px 0 0;color:var(--muted);font-size:12px}

/* KONFIRMASI USIA */
.age-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.age-box{width:100%;max-width:380px;padding:25px;background:#1d1d29;border:1px solid #414151;border-radius:16px;text-align:center;box-shadow:0 15px 50px #0009}
.age-box h2{margin:0 0 10px;font-size:21px}
.age-box p{color:var(--muted);font-size:13px;line-height:1.6}
.age-actions{display:flex;gap:9px;margin-top:18px}
.age-actions button{flex:1;padding:12px 8px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}
.age-yes{background:var(--accent);color:white}
.age-no{background:#353543;color:white}

/* PUSH VIDEO */
.push-ad{display:none;position:fixed;z-index:150;right:12px;bottom:14px;width:min(320px,calc(100% - 24px));padding:10px 40px 10px 10px;background:linear-gradient(135deg,#292936,#171721);border:1px solid #555568;border-radius:13px;box-shadow:0 8px 30px #000b;color:#fff;cursor:pointer}
.push-ad.show{display:flex;gap:10px;align-items:center;animation:pushIn .28s ease}
.push-ad.shake{animation:pushShake .12s linear 0s 16}
.push-thumb{width:104px;height:66px;flex:0 0 104px;object-fit:cover;border-radius:8px;background:#101018}
.push-copy{min-width:0}
.push-copy strong{display:block;font-size:12px;line-height:1.35;margin-bottom:5px}
.push-copy span{display:block;font-size:10px;color:#c5c5d0;line-height:1.4}
.push-close{position:absolute;right:7px;top:7px;width:27px;height:27px;border:0;border-radius:50%;background:#41414e;color:white;font-size:19px;cursor:pointer;z-index:2}
@keyframes pushIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes pushShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

@media(min-width:650px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .video-title{font-size:14px}
}
@media(min-width:950px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>

<!-- IKLAN PUSH VIDEO -->
<div class="push-ad" id="pushAd" role="button" tabindex="0" aria-label="Buka rekomendasi video">

const videos=raw.map((item,index)=>({
  id:index+1,
  title:"Video Pilihan "+String(index+1).padStart(2,"0"),
  embed:"https://vidara.to/e/"+item[0],
  thumb:"https://m996yefd.s1q2105.com/thumbnail/"+item[1]+"/"+item[0]+".jpg"
}));

/* ELEMEN HALAMAN */
const PER_PAGE=6;
let currentPage=1;
let filteredVideos=[...videos];

const grid=document.getElementById("videoGrid");
const pagination=document.getElementById("pagination");
const searchInput=document.getElementById("searchInput");
const searchButton=document.getElementById("searchButton");
const totalVideos=document.getElementById("totalVideos");

const playerScreen=document.getElementById("playerScreen");
const playerArea=document.getElementById("playerArea");
const playerTitle=document.getElementById("playerTitle");
const playerNumber=document.getElementById("playerNumber");
const backButton=document.getElementById("backButton");

const ageOverlay=document.getElementById("ageOverlay");
const pushAd=document.getElementById("pushAd");
const pushClose=document.getElementById("pushClose");
const pushThumb=document.getElementById("pushThumb");
const pushTitle=document.getElementById("pushTitle");
const pushText=document.getElementById("pushText");

let pushTimer=null;
let pushShakeTimer=null;
let pushCycle=0;
let pushActive=false;

/* TIGA KAMPANYE PUSH BERBEDA */
const pushCampaigns=[
  {
    videoIndex:2,
    title:"Video Pilihan Hari Ini",
    text:"Temukan tayangan pilihan yang menarik untuk ditonton."
  },
  {
    videoIndex:8,
    title:"Rekomendasi Berikutnya",
    text:"Ada video lain yang bisa kamu jelajahi sekarang."
  },
  {
    videoIndex:15,
    title:"Jangan Lewatkan Video Ini",
    text:"Lihat rekomendasi video pilihan lainnya."
  }
];

/* PLACEHOLDER THUMBNAIL */
const fallbackImage="data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360">'+
  '<rect width="100%" height="100%" fill="#292936"/>'+
  '<text x="50%" y="50%" fill="#ddd" font-size="22" text-anchor="middle" dominant-baseline="middle">Thumbnail tidak tersedia</text>'+
  '</svg>'
);

/* PEMICU SMARTLINK */
function triggerSmartlink(){
  const win=window.open(SMARTLINK,"_blank");
  if(win)win.opener=null;
  return !!win;
}

/* MEMBUAT KARTU VIDEO */
function createVideoCard(video,index){
  const card=document.createElement("article");
  card.className="video-card";

  const thumb=document.createElement("div");
  thumb.className="thumb";

  const img=document.createElement("img");
  img.src=video.thumb;
  img.alt=video.title;
  img.loading=index<2?"eager":"lazy";
  img.decoding="async";
  if(index<2)img.fetchPriority="high";

  img.onerror=function(){
    this.onerror=null;
    this.src=fallbackImage;
  };

  const play=document.createElement("div");
  play.className="play-icon";
  const playSymbol=document.createElement("span");
  playSymbol.textContent="▶";
  play.appendChild(playSymbol);
  thumb.append(img,play);

  const info=document.createElement("div");
  info.className="video-info";

  const title=document.createElement("div");
  title.className="video-title";
  title.textContent=video.title;

  const number=document.createElement("div");
  number.className="video-number";
  number.textContent="Video "+String(video.id).padStart(2,"0");

  info.append(title,number);
  card.append(thumb,info);

  card.addEventListener("click",()=>{
    triggerSmartlink();
    openVideo(video);
  });

  return card;
}

/* RENDER GALERI */
function renderVideos(){
  const totalPages=Math.max(1,Math.ceil(filteredVideos.length/PER_PAGE));
  currentPage=Math.min(currentPage,totalPages);

  const start=(currentPage-1)*PER_PAGE;
  const pageVideos=filteredVideos.slice(start,start+PER_PAGE);

  grid.innerHTML="";
  totalVideos.textContent=filteredVideos.length+" Video";

  if(pageVideos.length===0){
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent="Video tidak ditemukan.";
    grid.appendChild(empty);
    renderPagination(totalPages);
    return;
  }

  pageVideos.forEach((video,index)=>{
    grid.appendChild(createVideoCard(video,index));
  });

  renderPagination(totalPages);
}

/* PAGINASI OTOMATIS */
function renderPagination(totalPages){
  pagination.innerHTML="";
  if(totalPages<=1)return;

  const prev=document.createElement("button");
  prev.textContent="‹";
  prev.disabled=currentPage===1;
  prev.addEventListener("click",()=>{
    if(currentPage>1){
      currentPage--;
      renderVideos();
      scrollToGallery();
    }
  });
  pagination.appendChild(prev);

  let pages=[];
  if(totalPages<=7){
    for(let i=1;i<=totalPages;i++)pages.push(i);
  }else{
    pages.push(1);
    if(currentPage>3)pages.push("...");
    const first=Math.max(2,currentPage-1);
    const last=Math.min(totalPages-1,currentPage+1);
    for(let i=first;i<=last;i++)pages.push(i);
    if(currentPage<totalPages-2)pages.push("...");
    pages.push(totalPages);
  }

  pages.forEach(page=>{
    const button=document.createElement("button");
    if(page==="..."){
      button.textContent="...";
      button.disabled=true;
    }else{
      button.textContent=page;
      if(page===currentPage)button.classList.add("active");
      button.addEventListener("click",()=>{
        currentPage=page;
        renderVideos();
        scrollToGallery();
      });
    }
    pagination.appendChild(button);
  });

  const next=document.createElement("button");
  next.textContent="›";
  next.disabled=currentPage===totalPages;
  next.addEventListener("click",()=>{
    if(currentPage<totalPages){
      currentPage++;
      renderVideos();
      scrollToGallery();
    }
  });
  pagination.appendChild(next);
}

function scrollToGallery(){
  window.scrollTo({top:0,behavior:"smooth"});
}

/* PENCARIAN */
function runSearch(){
  const query=searchInput.value.trim().toLowerCase();
  filteredVideos=videos.filter(video=>
    video.title.toLowerCase().includes(query)
  );
  currentPage=1;
  renderVideos();
}
searchInput.addEventListener("input",runSearch);
searchButton.addEventListener("click",runSearch);

/* RESET PUSH SAAT VIDEO BARU DIBUKA */
function resetPushCampaign(){
  clearTimeout(pushTimer);
  clearTimeout(pushShakeTimer);
  pushAd.classList.remove("show","shake");
  pushCycle=0;
  pushActive=false;
}

/* JADWALKAN PUSH */
function schedulePush(delay){
  clearTimeout(pushTimer);
  if(pushCycle>=3||!playerScreen.classList.contains("show"))return;
  pushTimer=setTimeout(showPushAd,delay);
}

/* TAMPILKAN PUSH DAN GETAR 2 DETIK */
function showPushAd(){
  if(!playerScreen.classList.contains("show")||pushCycle>=3)return;

  const campaign=pushCampaigns[pushCycle];
  const video=videos[campaign.videoIndex];

  pushThumb.src=video.thumb;
  pushThumb.onerror=function(){
    this.onerror=null;
    this.src=fallbackImage;
  };

  pushTitle.textContent=campaign.title;
  pushText.textContent=campaign.text;

  pushCycle++;
  pushActive=true;

  pushAd.classList.remove("shake");
  pushAd.classList.add("show","shake");

  clearTimeout(pushShakeTimer);
  pushShakeTimer=setTimeout(()=>{
    pushAd.classList.remove("shake");
  },2000);
}

/* KLIK ISI IKLAN ATAU TOMBOL X */
function dismissPushAndContinue(){
  if(!pushActive)return;

  triggerSmartlink();

  pushActive=false;
  pushAd.classList.remove("show","shake");
  clearTimeout(pushShakeTimer);

  if(pushCycle<3)schedulePush(8000);
}

pushAd.addEventListener("click",event=>{
  if(event.target===pushClose)return;
  dismissPushAndContinue();
});

pushAd.addEventListener("keydown",event=>{
  if(event.key==="Enter"||event.key===" "){
    event.preventDefault();
    dismissPushAndContinue();
  }
});

pushClose.addEventListener("click",event=>{
  event.stopPropagation();
  dismissPushAndContinue();
});

/* BUKA PEMUTAR VIDEO */
function openVideo(video){
  playerTitle.textContent=video.title;
  playerNumber.textContent="Video "+String(video.id).padStart(2,"0");

  playerScreen.classList.add("show");
  document.body.style.overflow="hidden";
  playerArea.innerHTML="";

  const loading=document.createElement("div");
  loading.className="player-loading";
  loading.textContent="Memuat pemutar video...";
  playerArea.appendChild(loading);

  const iframe=document.createElement("iframe");
  iframe.src=video.embed;
  iframe.title=video.title;
  iframe.allow="autoplay; fullscreen; picture-in-picture";
  iframe.allowFullscreen=true;
  iframe.loading="eager";
  iframe.referrerPolicy="strict-origin-when-cross-origin";

  iframe.addEventListener("load",()=>loading.remove());
  playerArea.appendChild(iframe);

  /* PUSH PERTAMA SETELAH 20 DETIK */
  resetPushCampaign();
  schedulePush(20000);
}

/* TUTUP PEMUTAR DAN HENTIKAN TIMER */
function closeVideo(){
  clearTimeout(pushTimer);
  clearTimeout(pushShakeTimer);
  pushAd.classList.remove("show","shake");
  pushActive=false;
  pushCycle=0;

  playerArea.innerHTML="";
  playerScreen.classList.remove("show");
  document.body.style.overflow="";
}

backButton.addEventListener("click",closeVideo);

document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&playerScreen.classList.contains("show")){
    closeVideo();
  }
});

/* KONFIRMASI USIA: SMARTLINK SAAT KLIK YA */
document.getElementById("ageYes").addEventListener("click",()=>{
  ageOverlay.style.display="none";
  triggerSmartlink();
});

document.getElementById("ageNo").addEventListener("click",()=>{
  const message=ageOverlay.querySelector("p");
  message.textContent="Anda harus berusia minimal 18 tahun untuk melanjutkan.";
});

/* MULAI GALERI */
renderVideos();
console.info("Jumlah video:",videos.length);
</script>

</body>
</html>
