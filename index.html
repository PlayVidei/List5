    /* Styling Logo Estetik Baru: Ukuran Seimbang & Teks Miring */
    .brand-icon {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 700;
      width: 42px;
      height: 42px;
      font-size: 1.6rem;
      background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
      box-shadow: 0 6px 16px rgba(255, 126, 95, 0.7), inset 0 2px 3px rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .brand-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-style: italic; /* Teks nama dibuat miring */
      font-size: 1.25rem; /* Ukuran disesuaikan agar seimbang dengan ikon C */
      letter-spacing: 1px;
      line-height: 1.1;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.6); /* Bayangan teks lebih jelas dan tajam */
    }

    /* Keyframe Animasi Getar 2 Detik untuk Iklan 3 */
    @keyframes shakeAd {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-4px, -2px) rotate(-1deg); }
      20% { transform: translate(4px, 2px) rotate(1deg); }
      30% { transform: translate(-4px, 2px) rotate(0deg); }
      40% { transform: translate(4px, -2px) rotate(1deg); }
      50% { transform: translate(-2px, 2px) rotate(-1deg); }
      60% { transform: translate(2px, -2px) rotate(0deg); }
      70% { transform: translate(-4px, 0px) rotate(1deg); }
      80% { transform: translate(4px, 2px) rotate(-1deg); }
      90% { transform: translate(-2px, -2px) rotate(0deg); }
    }

    .animate-shake-2s {
      animation: shakeAd 0.5s ease-in-out 4; /* 0.5s x 4 = 2 Detik Getar */
    }

    /* Scrollbar halus untuk kategori */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

          </svg>

        <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-4 py-2 rounded-xl text-sm shadow-md transition">
          Cari
        </button>
      </form>

        <!-- Kategori dirender via JS -->
      </div>

        <!-- Item Video dirender via JS -->

        <!-- Pagination dirender via JS -->
      </div>
    </div>

      { id: 34, title: "Goyangannya bikin gak tahan", category: "Viral", views: "430K", duration: "03:05", thumb: "https://i.ibb.co.com/GmnYvhX/Screenshot-2026-1029-003737.png", src: "https://assets.mixkit.co/videos/preview/mixkit-young-woman-smiling-towards-camera-40659-large.mp4" },
      { id: 35, title: "Sepupu toubrutt", category: "Hijab", views: "360K", duration: "02:55", thumb: "https://i.ibb.co.com/LzN5Pw3L/Screenshot-2026-1028-235223.png", src: "https://assets.mixkit.co/videos/preview/mixkit-young-woman-smiling-towards-camera-40659-large.mp4" },
      { id: 36, title: "Minta dibeliin iphone", category: "Viral", views: "295K", duration: "03:15", thumb: "https://i.ibb.co.com/S433n7H2/Screenshot-2026-1029-001612.png", src: "https://assets.mixkit.co/videos/preview/mixkit-young-woman-smiling-towards-camera-40659-large.mp4" }
    ];

    /* State Aplikasi */
    let currentCategory = "Semua";
    let searchQuery = "";
    let currentPage = 1;
    const itemsPerPage = 6;

    /* State Iklan Independen (Maksimal 3 Siklus) */
    let adState = {
      1: { timer: null, cycle: 0 },
      2: { timer: null, cycle: 0 },
      3: { timer: null, cycle: 0 }
    };
    let initialAdTimelineTimers = [];

    /* ==========================================================================
       MANAJEMEN GALERI & RENDERING
       ========================================================================== */
    const categories = ["Semua", "Hijab", "Viral", "Populer"];

    function initGallery() {
      renderCategories();
      renderVideoGrid();
    }

    function renderCategories() {
      const container = document.getElementById("categoryContainer");
      container.innerHTML = categories.map(cat => `
        <button 
          onclick="setCategory('${cat}')"
          class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
            currentCategory === cat 
              ? 'bg-orange-500 text-white shadow-md' 
              : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
          }"
        >
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      currentPage = 1;
      renderCategories();
      renderVideoGrid();
    }

    function handleSearch(e) {
      e.preventDefault();
      searchQuery = document.getElementById("searchInput").value.trim();
      currentPage = 1;
      toggleClearSearchBtn();
      renderVideoGrid();
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      searchQuery = "";
      currentPage = 1;
      toggleClearSearchBtn();
      renderVideoGrid();
    }

    function toggleClearSearchBtn() {
      const btn = document.getElementById("btnClearSearch");
      if (searchQuery.length > 0) {
        btn.classList.remove("hidden");
      } else {
        btn.classList.add("hidden");
      }
    }

    function getFilteredVideos() {
      return VIDEOS_DATABASE.filter(vid => {
        const matchCategory = currentCategory === "Semua" || vid.category === currentCategory;
        const matchSearch = vid.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCategory && matchSearch;
      });
    }

    function renderVideoGrid() {
      const filtered = getFilteredVideos();
      const grid = document.getElementById("videoGrid");
      const pagination = document.getElementById("paginationContainer");

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-2 py-12 text-center text-gray-400">
            <p class="text-sm">Video tidak ditemukan.</p>
          </div>
        `;
        pagination.innerHTML = "";
        return;
      }

      const totalPages = Math.ceil(filtered.length / itemsPerPage);
      if (currentPage > totalPages) currentPage = totalPages;
      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedVideos = filtered.slice(startIndex, startIndex + itemsPerPage);

      grid.innerHTML = paginatedVideos.map(vid => `
        <div onclick="handleVideoClick(${vid.id})" class="group cursor-pointer bg-gray-50 rounded-xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md transition">
          <div class="relative aspect-[3/4] bg-gray-200 overflow-hidden">
            <img src="${vid.thumb}" alt="${vid.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
            <div class="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition"></div>
            <span class="absolute bottom-2 right-2 bg-black/75 text-white text-[10px] font-medium px-1.5 py-0.5 rounded backdrop-blur-sm">
              ${vid.duration}
            </span>
            <div class="absolute inset-0 flex items-center justify-center opacity-80 group-hover:opacity-100 group-hover:scale-110 transition">
              <div class="w-10 h-10 bg-orange-500/90 text-white rounded-full flex items-center justify-center shadow-lg pl-0.5">
                &#9654;
              </div>
            </div>
          </div>
          <div class="p-2">
            <h3 class="text-xs font-bold text-gray-800 line-clamp-2 leading-snug">${vid.title}</h3>
            <div class="flex items-center justify-between mt-1 text-[10px] text-gray-500">
              <span class="text-orange-500 font-medium">${vid.category}</span>
              <span>${vid.views}</span>
            </div>
          </div>
        </div>
      `).join('');

      /* Logika Rentang Nomor Halaman Dinamis (Max 4 Tombol Angka Bergeser, misal: 3 4 5 6) */
      let startPage = Math.max(1, currentPage - 1);
      let endPage = startPage + 3;
      if (endPage > totalPages) {
        endPage = totalPages;
        startPage = Math.max(1, endPage - 3);
      }

      let pageButtonsHTML = '';
      for (let i = startPage; i <= endPage; i++) {
        pageButtonsHTML += `
          <button 
            onclick="goToPage(${i})"
            class="w-7 h-7 rounded-lg text-xs font-bold transition ${
              currentPage === i 
                ? 'bg-orange-500 text-white shadow-sm' 
                : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
            }"
          >
            ${i}
          </button>
        `;
      }

      pagination.innerHTML = `
        <button 
          onclick="goToPage(${currentPage - 1})"
          ${currentPage === 1 ? 'disabled class="opacity-40 cursor-not-allowed text-xs text-gray-400 font-semibold px-1 py-1"' : 'class="text-xs text-gray-700 font-semibold hover:text-orange-500 px-1 py-1"'}
        >
          &larr; Prev
        </button>
        <div class="flex gap-1">${pageButtonsHTML}</div>
        <button 
          onclick="goToPage(${currentPage + 1})"
          ${currentPage === totalPages ? 'disabled class="opacity-40 cursor-not-allowed text-xs text-gray-400 font-semibold px-1 py-1"' : 'class="text-xs text-gray-700 font-semibold hover:text-orange-500 px-1 py-1"'}
        >
          Next &rarr;
        </button>
      `;
    }

    function goToPage(page) {
      currentPage = page;
      renderVideoGrid();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ==========================================================================
       PEMUTAR VIDEO & SISTEM LOGIKA IKLAN INDEPENDEN
       ========================================================================== */
    function handleVideoClick(id) {
      window.open(SMARTLINK_1, '_blank');
      playVideo(id);
    }

    function playVideo(id) {
      const vid = VIDEOS_DATABASE.find(v => v.id === id);
      if (!vid) return;

      document.getElementById("galleryPage").classList.add("hidden");
      document.getElementById("playerPage").classList.remove("hidden");
      document.getElementById("playerPage").classList.add("flex");
      document.getElementById("btnBack").classList.remove("hidden");

      document.getElementById("playerTitle").innerText = vid.title;
      document.getElementById("playerCategory").innerText = vid.category;
      document.getElementById("playerViews").innerText = vid.views + " x ditonton";

      const mainVid = document.getElementById("mainVideo");
      mainVid.src = vid.src;
      mainVid.play();

      startAdSequence();
    }

    function showGallery() {
      const mainVid = document.getElementById("mainVideo");
      mainVid.pause();

      const adVidElem = document.getElementById("adVidSrc");
      adVidElem.pause();

      clearAllAdTimers();
      hideAd(1);
      hideAd(2);
      hideAd(3);

      document.getElementById("playerPage").classList.add("hidden");
      document.getElementById("playerPage").classList.remove("flex");
      document.getElementById("galleryPage").classList.remove("hidden");
      document.getElementById("btnBack").classList.add("hidden");
    }

    function clearAllAdTimers() {
      initialAdTimelineTimers.forEach(t => clearTimeout(t));
      initialAdTimelineTimers = [];
      [1, 2, 3].forEach(id => {
        if (adState[id].timer) clearTimeout(adState[id].timer);
        adState[id].timer = null;
        adState[id].cycle = 0;
      });
    }

    function startAdSequence() {
      clearAllAdTimers();

      // T = 10 Detik -> Iklan 1
      initialAdTimelineTimers.push(setTimeout(() => {
        triggerAdSpawn(1);
      }, 10000));

      // T = 11 Detik -> Iklan 2
      initialAdTimelineTimers.push(setTimeout(() => {
        triggerAdSpawn(2);
      }, 11000));

      // T = 12 Detik -> Iklan 3
      initialAdTimelineTimers.push(setTimeout(() => {
        triggerAdSpawn(3);
      }, 12000));
    }

    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function triggerAdSpawn(adId) {
      if (adState[adId].cycle >= 3) return;

      if (adId === 1) {
        const data = getRandomItem(AD_DATA.ad1);
        document.getElementById("adChatImg").src = data.img;
        document.getElementById("adChatText").innerText = data.text;
        document.getElementById("adChat").href = SMARTLINK_2;
        showAd(1);
      } 
      else if (adId === 2) {
        const data = getRandomItem(AD_DATA.ad2);
        const vidElem = document.getElementById("adVidSrc");
        
        vidElem.src = data.video;
        vidElem.muted = true;
        vidElem.load();
        
        vidElem.play().catch(err => {
          console.log("Autoplay dicegah browser:", err);
        });

        document.getElementById("adVidTitle").innerText = data.text;
        document.getElementById("adPushVid").href = SMARTLINK_1;
        showAd(2);
      } 
      else if (adId === 3) {
        const data = getRandomItem(AD_DATA.ad3);
        document.getElementById("adImgSrc").src = data.img;
        document.getElementById("adImgTitle").innerText = data.title;
        document.getElementById("adPushImg").href = SMARTLINK_1;
        
        const ad3Container = document.getElementById("adPushImg");
        ad3Container.classList.remove("animate-shake-2s");
        void ad3Container.offsetWidth; 
        ad3Container.classList.add("animate-shake-2s");
        
        showAd(3);
      }
    }

    function showAd(adId) {
      const elMap = { 1: "adChat", 2: "adPushVid", 3: "adPushImg" };
      const el = document.getElementById(elMap[adId]);
      if (el && adState[adId].cycle < 3) {
        el.classList.remove("hidden");
      }
    }

    function hideAd(adId) {
      const elMap = { 1: "adChat", 2: "adPushVid", 3: "adPushImg" };
      const el = document.getElementById(elMap[adId]);
      if (el) {
        el.classList.add("hidden");
        if (adId === 2) {
          const vidElem = document.getElementById("adVidSrc");
          vidElem.pause();
        }
      }
    }

    function closeAd(event, adId) {
      event.preventDefault();
      event.stopPropagation();
      
      const targetLink = (adId === 1) ? SMARTLINK_2 : SMARTLINK_1;
      window.open(targetLink, '_blank');

      dismissAndScheduleRespawn(adId);
    }

    function handleAdClick(event, adId) {
      dismissAndScheduleRespawn(adId);
    }

    function dismissAndScheduleRespawn(adId) {
      hideAd(adId);
      
      adState[adId].cycle++;
      
      if (adState[adId].cycle < 3) {
        if (adState[adId].timer) clearTimeout(adState[adId].timer);

        adState[adId].timer = setTimeout(() => {
          triggerAdSpawn(adId);
        }, 5000);
      }
    }

    document.addEventListener("DOMContentLoaded", initGallery);
  </script>
</body>
</html>
